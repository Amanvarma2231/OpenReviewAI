[theme]
base                     = "light"
primaryColor             = "#2563EB"
backgroundColor          = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor                = "#0F172A"
font                     = "sans serif"

[server]
headless                 = false
enableCORS               = true
enableXsrfProtection     = false
port                     = 8501
maxUploadSize            = 10

[browser]
gatherUsageStats         = false
serverAddress            = "localhost"

[client]
showErrorDetails         = true
toolbarMode              = "minimal"

[runner]
fastReruns               = true
