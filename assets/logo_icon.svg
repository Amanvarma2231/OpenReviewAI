<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Blue Code Bracket Gradient -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Green Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- AI Spark Node Gradient -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#sqGrad)" stroke="#334155" stroke-width="2" filter="url(#softShadow)" />
  <rect x="10" y="10" width="100" height="100" rx="24" fill="none" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Collaborative AI Network Nodes (Subtle Background Geometry) -->
  <line x1="38" y1="60" x2="60" y2="38" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3,3" />
  <line x1="60" y1="38" x2="82" y2="60" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3,3" />
  <line x1="38" y1="60" x2="60" y2="82" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3,3" />
  <line x1="60" y1="82" x2="82" y2="60" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3,3" />

  <!-- Left Code Bracket: < -->
  <path d="M 46 40 L 32 60 L 46 80"
        fill="none"
        stroke="url(#bracketGrad)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Unified Right Bracket + Verified Checkmark Motif: ✓ -->
  <!-- Starts near center, drops to form verification pivot, then soars up to complete the checkmark -->
  <path d="M 54 62 L 66 76 L 88 42"
        fill="none"
        stroke="url(#checkGrad)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- AI Collaborative Catalyst Spark (Top Center Node) -->
  <circle cx="60" cy="38" r="4.5" fill="#38BDF8" />
  <circle cx="60" cy="38" r="8" fill="url(#sparkGlow)" opacity="0.6" />

  <!-- Right Anchor Node -->
  <circle cx="88" cy="42" r="3.5" fill="#34D399" />
</svg>
