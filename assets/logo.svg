<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="sqGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="bracketGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Emerald Checkmark Gradient -->
    <linearGradient id="checkGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- AI Badge Gradient -->
    <linearGradient id="aiPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadowH" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- ── Left Icon Container (64x64 at x=10, y=13) ── -->
  <g transform="translate(10, 13)">
    <!-- Squircle Frame -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#sqGradH)" stroke="#334155" stroke-width="1.5" filter="url(#softShadowH)" />
    <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3" />

    <!-- Left Code Bracket: < -->
    <path d="M 25 21 L 15 32 L 25 43"
          fill="none"
          stroke="url(#bracketGradH)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Right Bracket + Verified Checkmark: ✓ -->
    <path d="M 29 33 L 36 41 L 49 22"
          fill="none"
          stroke="url(#checkGradH)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- AI Collaborative Node -->
    <circle cx="32" cy="18" r="2.5" fill="#38BDF8" />
  </g>

  <!-- ── Wordmark Typography ── -->
  <g transform="translate(90, 42)">
    <!-- OpenReview Text -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.03em" fill="#0F172A">
      Open<tspan fill="#2563EB" font-weight="800">Review</tspan>
    </text>

    <!-- AI Pill Badge -->
    <rect x="168" y="-22" width="40" height="23" rx="6" fill="url(#aiPillGrad)" />
    <text x="188" y="-6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="0.06em" fill="#FFFFFF" text-anchor="middle">
      AI
    </text>

    <!-- Tagline: Code Better with AI Together -->
    <text x="2" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.04em" fill="#64748B">
      CODE BETTER WITH AI TOGETHER
    </text>
  </g>
</svg>
